services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    image: agsuite-backend:latest

    user: "appuser"

    # Redis / Celery are OPTIONAL: the app runs with only PostgreSQL.
    # Enable them with:  docker compose --profile full up -d

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      static_init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/monitoring/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    env_file:
      - ./.env.docker

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECURE_SSL_REDIRECT: "False"

      # CELERY_BROKER_URL / REDIS_URL come from .env.docker (see env.docker.example)
      # when you use `--profile full`; leave them unset for the minimal setup.


    expose:
      - "8000"

    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000

    restart: unless-stopped

  postgres:
    
    image: postgres:18
    
    env_file:
    - ./.env.postgres

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agsuite_user -d agsuite_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  static_init:
    image: alpine:3.22
    command: >
      sh -c "chown -R 1000:1000 /app/staticfiles"
    volumes:
      - static_data:/app/staticfiles
    restart: "no"

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  celery_worker:
      profiles: ["full"]
      image: agsuite-backend:latest
      user: "appuser"
      entrypoint: []

      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
  
      env_file:
        - ./.env.docker
  
      environment:
        DJANGO_SETTINGS_MODULE: config.settings.production
        SECURE_SSL_REDIRECT: "False"
        CELERY_BROKER_URL: redis://redis:6379/0
        CELERY_RESULT_BACKEND: redis://redis:6379/0
  
      volumes:
        - media_data:/app/media
  
      command: >
        celery -A config.celery
        worker
        --loglevel=info
      
      restart: unless-stopped

  celery_beat:
    profiles: ["full"]
    image: agsuite-backend:latest
    user: "appuser"
    entrypoint: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECURE_SSL_REDIRECT: "False"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media

    command: >
      celery -A config.celery
      beat
      --loglevel=info
    
    restart: unless-stopped

    # Dedicated OCR worker that needs only PostgreSQL (no Celery / Redis):
    #   set OCR_EXECUTION_MODE=external in .env.docker, then
    #   docker compose --profile worker up -d
    ocr_worker:
      profiles: ["worker"]
      image: agsuite-backend:latest
      user: "appuser"
      entrypoint: []
      depends_on:
        postgres:
          condition: service_healthy
      env_file:
        - ./.env.docker
      environment:
        DJANGO_SETTINGS_MODULE: config.settings.production
        SECURE_SSL_REDIRECT: "False"
      volumes:
        - media_data:/app/media
      command: python manage.py run_ocr_worker
      restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: agsuite-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

    restart: unless-stopped

volumes:
  media_data:
  static_data:
  postgres_data:
  redis_data:
